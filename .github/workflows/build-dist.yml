name: Build dist

# Two-mode workflow for the dist/ build pipeline:
#
#   pull_request → AUTO-FIX MODE
#     Rebuilds dist/ from SCSS, and if the rebuilt dist/ differs from
#     what's committed, pushes a 'chore(brand): rebuild dist from SCSS'
#     commit back to the PR branch. Never fails on drift — it just
#     fixes it. Means contributors can submit SCSS changes without
#     remembering to run `npm run build` locally; CI does it for them.
#
#   push to kkux.teak.prod/master → CHECK-ONLY MODE
#     Someone bypassed the PR and pushed directly (e.g. a hotfix merge).
#     If their commit landed with stale dist/, CI fails with the
#     actionable fix message so the bad commit can be amended or
#     a follow-up pushed. We can't auto-fix here because GITHUB_TOKEN
#     is read-only on protected branches.
#
# Contributor workflow:
#   nvm use                                  # pick up .nvmrc (Node 18.17.0)
#   npm ci                                   # install sass + transitives
#   # edit paragon/_variables.scss or paragon/_overrides.scss
#   npm run build                            # regenerate dist/ locally
#   git add paragon/ dist/                   # commit SCSS + dist/ together
#   git commit -m "feat(brand): ..."
#   git push
#
# If you forget step 3-4, CI does it for you on PR. If you push to main
# directly with stale dist/, CI fails — fix by running
# `npm run build && git add dist/ && git commit --amend --no-edit`.

on:
  pull_request:
    branches: [kkux.teak.prod, master]
  push:
    branches: [kkux.teak.prod, master]

permissions:
  contents: write

jobs:
  build-dist:
    name: Build dist/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache sass install
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-sass-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-sass-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build dist/ from SCSS sources
        run: npm run build

      - name: Auto-commit rebuilt dist/ to PR branch (auto-fix mode)
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "kkux-brand-build"
          git config user.email "kkux-brand-build@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "OK: committed dist/ already matches npm run build output"
            echo "     (contributor remembered to rebuild locally — no auto-commit needed)"
          else
            echo "Drift detected — pushing rebuild commit to PR branch"
            echo ""
            echo "Changes to commit:"
            git diff --cached --stat dist/ | sed 's/^/  /'
            echo ""
            git commit -m "chore(brand): rebuild dist from SCSS

          Auto-generated by .github/workflows/build-dist.yml.
          Triggered because the SCSS sources in this PR changed but the
          committed dist/ CSS files weren't regenerated locally.

          To avoid this auto-commit in future PRs, run locally:
            npm ci
            npm run build
            git add dist/
            # then commit alongside your SCSS changes"
            git push
            echo ""
            echo "::notice title=dist/ regenerated::Pushed rebuild commit to PR branch"
          fi

      - name: Verify dist/ is in sync (push event only — check mode)
        if: github.event_name == 'push'
        run: |
          # On direct pushes to kkux.teak.prod/master, GITHUB_TOKEN is
          # read-only so we can't auto-fix. Just verify and fail loudly.
          git add -Af dist/
          if ! git diff --cached --exit-code -- dist/; then
            echo "::error::dist/ is out of sync with SCSS sources."
            echo ""
            echo "A commit landed on kkux.teak.prod/master with stale dist/."
            echo "Fix by amending the commit (or pushing a follow-up):"
            echo "  npm ci && npm run build"
            echo "  git add dist/ && git commit --amend --no-edit"
            echo "  git push --force-with-lease"
            echo ""
            echo "Drift summary:"
            git diff --cached --stat dist/ | sed 's/^/  /'
            exit 1
          fi
          echo "OK: dist/ in sync with SCSS sources"